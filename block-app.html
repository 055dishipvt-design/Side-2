<!DOCTYPE html>
<html lang="en" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Block · Questions, Game, Day</title>
<style>
:root{--bg:#fffafc;--card:#fff;--ink:#3a2f35;--mut:#9a8790;--ln:#f0dfe6;--tan:#fdeef3;--rose:#F2A8BE;--pk:#c9577f;--pkl:#fdeef3;--ye:#b9861f;--rv:#7a62c4;--rvl:#ece5f8;--mint:#CFE8D5;--mintx:#3f7a55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1719;--card:#241f21;--ink:#f1e8ea;--mut:#a8969d;--ln:#3c3438;--tan:#2e2629;--rose:#d98aa4;--pk:#F2A8BE;--pkl:#2e2629;--ye:#f0d77a;--rv:#c4b3ec;--rvl:#2a2433;--mint:#24362b;--mintx:#a9d8b8;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:560px;margin:0 auto;padding:10px 14px 96px}
button,input,select,textarea{font:inherit;color:var(--ink);background:var(--tan);border:1px solid var(--ln);border-radius:999px;padding:8px 14px;min-height:42px;max-width:100%}
textarea{width:100%;min-height:74px;border-radius:16px;background:var(--card)}
input[type=file]{border-radius:16px;width:100%;margin-bottom:8px}
button{cursor:pointer;font-weight:600}
button.pk{background:var(--rose);border-color:var(--rose);color:#3a2f35;font-weight:700}
button.sm{min-height:34px;padding:3px 12px;font-size:13px}
.tabs{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:540px;margin:0 auto;display:flex;gap:6px;padding:6px;background:var(--card);border:1px solid var(--ln);border-radius:999px;box-shadow:0 4px 18px rgba(217,119,154,.18);z-index:5}
.tabs button{flex:1;border:0;min-height:44px;background:none;color:var(--mut)}.tabs .on{background:var(--rose);color:#3a2f35;font-weight:800}
.top{display:flex;align-items:center;gap:8px;padding:14px 16px;margin:2px 0 12px;border-radius:20px;background:linear-gradient(135deg,#F7C6D9,#F9D3B4 55%,#F7E3A1);color:#3a2f35}
.top b{font-size:18px;flex:1}.top .m,.top .tm{color:#5b4650}.top button{background:rgba(255,255,255,.65);border-color:transparent;color:#3a2f35}
.tm{font-variant-numeric:tabular-nums;font-weight:700}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 6px}
.pills div{text-align:center;font-size:12px;padding:7px 2px;border-radius:999px;background:var(--tan);color:var(--mut);border:1px solid var(--ln)}
.pills .on{background:var(--rose);border-color:var(--rose);color:#3a2f35;font-weight:800}.pills .dn{background:var(--mint);border-color:var(--mint);color:var(--mintx)}
.ph{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin:0 6px 8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(217,119,154,.08)}
.card.rv{background:linear-gradient(var(--rvl),var(--card) 100px);border-color:var(--rvl)}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.07em;padding:4px 11px;border-radius:999px;background:var(--mint);color:var(--mintx)}.rv .tag{background:var(--rvl);color:var(--rv)}
.hd{display:flex;align-items:center;justify-content:space-between}
.slot{font-variant-numeric:tabular-nums;font-weight:800;font-size:28px;color:var(--pk)}.slot.over{color:var(--ye)}
.cr{font-size:12px;color:var(--mut);margin-top:10px}.q{font-size:19px;font-weight:700;margin:4px 0 10px}
.acts{display:grid;gap:8px;margin-top:12px}.acts.three{grid-template-columns:repeat(3,1fr)}
.bar{height:10px;border-radius:99px;background:var(--tan);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#F7C6D9,#F2A8BE);transition:width .4s}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mut)}.r b{color:var(--ink)}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:center}
.st div{background:var(--tan);border-radius:16px;padding:9px 4px;font-size:12px;color:var(--mut)}.st b{display:block;font-size:20px;color:var(--ink)}
.blk{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border:1px solid var(--ln);border-radius:16px;margin-top:8px;font-size:14px;background:var(--card)}
.blk.now{border-color:var(--rose);background:var(--tan)}.blk small{color:var(--mut)}
.row{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}.row>input,.row>select{flex:1;min-width:90px}
.qi{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln);font-size:14px}.qi b{min-width:30px;color:var(--pk)}.qi span{flex:1}
h3{margin:16px 6px 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}.card h3{margin-left:0}.m{color:var(--mut);font-size:12px}
details summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px;font-weight:700}
summary::-webkit-details-marker{display:none}summary>span::before{content:"▸ ";color:var(--mut)}details[open]>summary>span::before{content:"▾ "}
summary small{color:var(--mut);font-weight:600;font-size:12px;white-space:nowrap}
details.sj{margin-bottom:14px}details.sj>summary{font-size:20px}
details.ch{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:2px 14px;margin-top:10px;box-shadow:0 2px 10px rgba(217,119,154,.08)}
details.tp{margin-top:10px;padding:0 12px 4px;border:1px solid var(--ln);border-radius:14px;background:var(--tan)}details.tp>summary{font-size:14px;min-height:40px}
.cb{padding-bottom:10px}.qi{align-items:center}.tk{background:var(--mint);color:var(--mintx);border-color:var(--mint)}
details.card{padding-top:2px;padding-bottom:6px}
</style></head>

const fd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>fd(new Date(Date.now()-216e5)),fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const hm=m=>String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
function fix(){if(!S||!Array.isArray(S.subj))S={v:1,subj:[],q:[]};["q","rv","ses"].forEach(k=>S[k]=S[k]||[]);S.ctr=S.ctr||{};S.sel=S.sel||{};S.day=S.day||{};S.goal=S.goal||10;
S.subj.forEach(s=>{s.ch=s.ch||[];s.ch.forEach(c=>c.topics=c.topics||[])});S.q.forEach(q=>{if(q.topic===undefined)q.topic="";q.p=q.p||[[0,0,0]]})}
fix();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const Q=id=>S.q.find(q=>q.id===id),sid=()=>(S.ses[S.ses.length-1]||{id:"new"}).id;
const D=()=>S.day[today()]||(S.day[today()]={l:0,r:0,secs:0});
const flat=()=>{const a=[];S.subj.forEach(s=>s.ch.forEach(c=>a.push({s,c})));return a};
function label(q){const f=flat().find(x=>x.c.id===q.c);const t=f&&f.c.topics.find(x=>x.id===q.topic);return f?f.c.name+(t?" · "+t.name:""):""}
function logQ(k){D()[k]++;if(k==="l")qh({q:1})}
function chName(q){const f=flat().find(x=>x.c.id===q.c);return f?f.c.name:""}
let lastK="",pend=[];
let view="game",run=true,tk=0;
/* ---------- queue: continuous across chapters and topics ---------- */
function queue(n){const F=flat(),out=[];if(!F.length)return out;let st=F.findIndex(x=>x.c.id===S.sel.c);if(st<0)st=0;
 for(let k=0;k<F.length&&out.length<n;k++){const c=F[(st+k)%F.length].c,to=id=>{const i=c.topics.findIndex(y=>y.id===id);return i<0?999:i};
  let a=S.q.filter(q=>!q.done&&q.c===c.id).sort((x,y)=>to(x.topic)-to(y.topic)||x.n-y.n);if(k===0&&S.sel.start){const i=a.findIndex(q=>q.id===S.sel.start);if(i>0)a=a.slice(i).concat(a.slice(0,i))}a.forEach(q=>{if(out.length<n)out.push(q.id)})}
 return out}
/* ---------- game ---------- */
function go(){const ids=queue(10);S.sel.start="";S.sum=null;if(!ids.length){S.b=null;save();render();return}
 S.b={ids,ord:ids,ph:0,i:0,pt:0,qt:0,show:false,got:0,old:0,slot:0};slot();save();render()}
function slot(){const b=S.b,n=b.ord.length;b.slot=Math.max(15,(n*PH[b.ph].per-b.pt)/(n-b.i))}
function review(b){return b.ids.slice()}
function adv(v){const b=S.b,q=Q(b.ord[b.i]);
 if(b.ph===0&&q&&!q.done){q.done=true;q.sid=sid();q.xp=BASE[q.d]||20;q.p=q.p.map(p=>p.map(x=>x||2));logQ("l")}
 if(b.ph===2&&q){const r={id:uid(),qid:q.id,sid:sid(),st:[v,v,v],done:true,xp:1,date:today()};if(v===1)r.miss=true;S.rv.push(r);logQ("r");if(v===3)b.got++;if(!b.ids.includes(q.id))b.old++}
 b.i++;b.qt=0;
 if(b.i>=b.ord.length){b.ph++;b.i=0;b.pt=0;
  if(b.ph===3){S.sum={n:b.ids.length,got:b.got,total:b.ord.length,old:b.old};S.b=null;S.auto=8;save();render();return}
  if(b.ph===2)b.ord=review(b)}
 b.show=false;slot();save();render()}
function rGame(){const b=S.b,m=S.sum;
 let h=`<div class="top"><b>▶ Block</b><span class="tm" id="tm"></span><button class="sm" id="pz">${run?"Pause":"Resume"}</button></div>
 ${GOAL()}<div class="pills">${PH.map((p,i)=>`<div class="${b&&i===b.ph?"on":(b&&i<b.ph)||m?"dn":""}">${i+1} · ${p.n}</div>`).join("")}</div>
 <div class="ph"><span>${b?"Question "+(b.i+1)+" of "+b.ord.length:""}</span><span id="pl"></span></div>`;
 if(m)h+=`<div class="card"><span class="tag">BATCH DONE</span><div class="q">${m.n} learned · ${m.got}/${m.total} held in review</div><div class="m">Revised the same ${m.total} questions, in the order you learned them.</div><div class="acts"><button class="pk" id="nx">Next 10 starts in <span id="au">${S.auto}</span>s · start now</button></div></div>`;
 else if(!b){const q=Q(queue(1)[0]);h+=`<div class="card"><span class="tag">READY</span><div class="q">${q?"10 questions, 60 minutes":"Nothing left to learn here"}</div><div class="m">${q?"Starts at: "+esc(label(q)):"Import your backup or add questions in the Questions tab."}</div>${q?'<div class="acts"><button class="pk" id="st">Start block</button></div>':""}</div>`}
 else{const q=Q(b.ord[b.i]),R=b.ph===2,old=R&&!b.ids.includes(q.id);if(b.ph===0){const k=b.i+":"+q.id;if(k!==lastK){lastK=k;qh({ch:chName(q)})}}
  h+=`<div class="card${R?" rv":""}"><div class="hd"><span class="tag">${R?(old?"SPONTANEOUS · EARLIER":"QUICK REVIEW"):PH[b.ph].n.toUpperCase()}</span><span class="slot" id="slot"></span></div>
  <div class="cr">${esc(label(q))}</div><div class="q">${esc(q.t)}</div>${b.show?`<textarea id="nt" placeholder="Your note (optional)">${esc(q.note||"")}</textarea>`:""}
  <div class="acts">${R?'<div class="acts three"><button data-v="1">✗ Missed</button><button data-v="2">~ Partly</button><button class="pk" data-v="3">✓ Got it</button></div>':'<button class="pk" data-v="3">Next question →</button>'}<button class="sm" id="sh">${b.show?"Hide note":"Note"}</button></div></div>`}
 $("#v").innerHTML=h;tUI();
 $("#pz").onclick=()=>{run=!run;$("#pz").textContent=run?"Pause":"Resume"};
 document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{S.goal=Math.max(1,Math.min(100,S.goal+ +b.dataset.g));save();rGame()});
 if($("#nx"))$("#nx").onclick=go;if($("#st"))$("#st").onclick=go;
 if(b){$("#sh").onclick=()=>{b.show=!b.show;render()};document.querySelectorAll("[data-v]").forEach(x=>x.onclick=()=>adv(+x.dataset.v));
  const nt=$("#nt");if(nt)nt.oninput=()=>{Q(b.ord[b.i]).note=nt.value;save()}}}
function tUI(){const e=$("#tm");if(e)e.textContent=fmt(D().secs);const b=S.b;if(!b)return;
 const l=b.slot-b.qt,s=$("#slot");if(s){s.textContent=(l<0?"+":"")+fmt(Math.abs(l));s.className="slot"+(l<0?" over":"")}
 const p=$("#pl");if(p)p.textContent=fmt(b.ord.length*PH[b.ph].per-b.pt)+" left in phase"}
/* ---------- Day: your original Quest Hub page, unchanged, plus the same bridge the old tracker used ---------- */
function dayInit(){const h=$("#pdy");if(h.firstChild)return;const b=atob($("#dayb64").textContent.trim()),f=document.createElement("iframe");f.title="Day";f.style.cssText="width:100%;height:calc(100dvh - 92px);border:0;display:block";f.srcdoc=new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0)));f.onload=()=>{try{f.contentDocument.documentElement.dataset.theme="light"}catch(e){}};h.appendChild(f)}
function dayFrame(){try{const f=document.querySelector("#pdy iframe"),w=f&&f.contentWindow;return w&&w.eval('typeof ens==="function"&&typeof curIdx==="function"&&typeof todayS==="function"')?w:null}catch(e){return null}}
function qhApply(o){const D=ens(todayS());let k=D.blocks.findIndex(b=>b.run&&!b.r);if(k<0)k=curIdx(D);const b=D.blocks[k];if(!b||b.r)return;
 if(o.ch){b.gch=b.gch||[];if(b.gch.indexOf(o.ch)<0)b.gch.push(o.ch);const t=b.gch.join(", ");if(!b.n||b.n===b.auto){b.n=t;b.auto=t}}
 if(o.q)b.q+=o.q;save();try{render(true)}catch(e){}}
function qh(o){pend.push(o);flushQ()}
function flushQ(){if(!pend.length)return;const w=dayFrame();if(!w)return;try{const f=w.eval("("+qhApply.toString()+")");pend.splice(0).forEach(o=>f(o))}catch(e){}}
function GOAL(){const d=D();return`<div class="card" style="padding:10px 14px"><div class="r"><span>Today’s goal</span><span><b>${d.l}</b> / <b>${S.goal}</b> questions <button class="sm" data-g="-1">−</button> <button class="sm" data-g="1">+</button></span></div><div class="bar"><i style="width:${Math.min(100,d.l/S.goal*100)}%"></i></div></div>`}
/* ---------- questions ---------- */
let ui={open:{},ask:null};
const cut=(t,n)=>{const w=String(t||"").trim().split(/\s+/);return w.length>n?w.slice(0,n).join(" ")+"…":w.join(" ")};
function unlearn(q){q.done=false;delete q.sid;delete q.xp;q.p=q.p.map(p=>p.map(()=>0))}
function qrow(q){return`<div class="qi"><b>${q.n}</b><span>${esc(q.t)}</span>`+(ui.ask===q.id?`<span class="m">Learn again?</span><button class="sm pk" data-u="${q.id}">Yes</button><button class="sm" data-u="">No</button>`:q.done?`<button class="sm tk" data-a="${q.id}" title="Remove tick">✓</button>`:`<button class="sm" data-pl="${q.id}" title="Learn from here">▶</button>`)+`</div>`}
function tree(){const st=qs=>({n:qs.length,d:qs.filter(q=>q.done).length}),bar=o=>`<div class="bar"><i style="width:${o.n?o.d/o.n*100:0}%"></i></div>`,op=k=>ui.open[k]?" open":"";
 return S.subj.map(s=>{const sq=S.q.filter(q=>q.s===s.id),so=st(sq);
  return`<details class="sj" data-k="s${s.id}"${ui.open["s"+s.id]!==false?" open":""}><summary><span>${esc(cut(s.name,6))}</span><small>${so.d}/${so.n}</small></summary>${bar(so)}`+s.ch.map(c=>{const cq=sq.filter(q=>q.c===c.id),co=st(cq);
   const gs=c.topics.map(t=>({id:t.id,name:t.name,qs:cq.filter(q=>q.topic===t.id)})),none=cq.filter(q=>!c.topics.some(t=>t.id===q.topic));if(none.length)gs.push({id:"",name:"No topic",qs:none});
   return`<details class="ch" data-k="c${c.id}"${op("c"+c.id)}><summary><span>${esc(cut(c.name,6))}</span><small>${co.d}/${co.n}</small></summary><div class="cb">${bar(co)}`+gs.map(g=>{const o=st(g.qs),k="t"+c.id+g.id;
    return`<details class="tp" data-k="${k}"${op(k)}><summary><span>${esc(cut(g.name,6))}</span><small>${o.d}/${o.n}</small></summary>${bar(o)}${g.qs.slice().sort((a,b)=>a.n-b.n).map(qrow).join("")||'<div class="m" style="padding:8px 0">No questions yet</div>'}</details>`}).join("")+`</div></details>`}).join("")+`</details>`}).join("")}
function rQs(){const s=S.subj.find(x=>x.id===S.sel.s)||S.subj[0],c=s&&(s.ch.find(x=>x.id===S.sel.c)||s.ch[0]);if(s)S.sel.s=s.id;if(c)S.sel.c=c.id;const t=c&&c.topics.find(x=>x.id===S.sel.t);if(!t)S.sel.t="";
 const opt=(a,v)=>a.map(x=>`<option value="${x.id}"${x.id===v?" selected":""}>${esc(x.name)}</option>`).join(""),op=k=>ui.open[k]?" open":"";
 $("#v").innerHTML=`<div class="top"><b>☰ Questions</b><span class="m">${S.q.filter(q=>q.done).length} / ${S.q.length} learned</span></div>
 ${S.subj.length?tree():'<div class="card m">No subjects yet. Import your backup below, or add a subject.</div>'}
 <details class="card" data-k="add"${op("add")}><summary><span>＋ Add questions</span></summary><div class="row"><select id="ss">${opt(S.subj,s&&s.id)}</select><select id="cs">${s?opt(s.ch,c&&c.id):""}</select><select id="ts"><option value="">No topic</option>${c?opt(c.topics,S.sel.t):""}</select></div>
 <div class="row"><input id="nn" placeholder="Name to add"><button class="sm" data-n="s">+ subject</button><button class="sm" data-n="c">+ chapter</button><button class="sm" data-n="t">+ topic</button></div>
 <textarea id="bk" placeholder="One question per line, added to the chapter and topic above" style="margin-top:8px"></textarea><div class="row"><select id="bd"><option>Easy</option><option selected>Moderate</option><option>Very Hard</option></select><button class="pk" id="bb">+ Add</button></div></details>
 <details class="card" data-k="bu"${op("bu")}><summary><span>Backup</span></summary><div class="m">Import the JSON backup from your old tracker. It replaces what is in this app.</div><input type="file" id="jf" accept=".json,application/json"><textarea id="jt" placeholder="…or paste JSON here"></textarea>
 <div class="row"><button id="ji">Import</button><button id="je">Export (show JSON)</button></div></details>`;
 const rs=()=>{save();rQs()};
 document.querySelectorAll("details[data-k]").forEach(d=>d.ontoggle=()=>{ui.open[d.dataset.k]=d.open});
 document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{ui.ask=b.dataset.a;rQs()});
 document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{const q=Q(b.dataset.u);if(q)unlearn(q);ui.ask=null;rs()});
 document.querySelectorAll("[data-pl]").forEach(b=>b.onclick=()=>{const q=Q(b.dataset.pl);S.sel.c=q.c;S.sel.start=q.id;view="game";go()});
 $("#ss").onchange=e=>{S.sel.s=e.target.value;S.sel.c="";S.sel.t="";rs()};$("#cs").onchange=e=>{S.sel.c=e.target.value;S.sel.t="";rs()};$("#ts").onchange=e=>{S.sel.t=e.target.value;rs()};
 document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{const n=$("#nn").value.trim(),k=b.dataset.n;if(!n)return;
  if(k==="s")S.subj.push({id:uid(),name:n,ch:[]});else if(s&&k==="c")s.ch.push({id:uid(),name:n,topics:[]});else if(c&&k==="t")c.topics.push({id:uid(),name:n});rs()});
 $("#bb").onclick=()=>{if(!c)return;const L=$("#bk").value.split("\n").map(x=>x.trim()).filter(Boolean);L.forEach(x=>{S.ctr[c.id]=(S.ctr[c.id]||0)+1;S.q.push({id:uid(),s:s.id,c:c.id,topic:S.sel.t||"",n:S.ctr[c.id],t:x,d:$("#bd").value,p:[[0,0,0]]})});rs()};
 const imp=txt=>{try{const o=JSON.parse(txt);if(!Array.isArray(o.subj)||!Array.isArray(o.ses))throw 0;S=o;S.b=null;S.sum=null;fix();save();rQs();alert("Imported "+S.q.length+" questions, "+S.q.filter(q=>q.done).length+" already learned.")}catch(e){alert("That does not look like a tracker backup.")}};
 $("#jf").onchange=e=>{const f=e.target.files[0];if(f)f.text().then(imp)};$("#ji").onclick=()=>{if($("#jt").value.trim())imp($("#jt").value)};
 $("#je").onclick=()=>{$("#jt").value=JSON.stringify(S);$("#jt").select()}}
/* ---------- shell and the one clock ---------- */
function render(){document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===view));const dv=view==="day";$("#v").hidden=dv;$("#pdy").hidden=!dv;if(dv)dayInit();else(view==="game"?rGame:rQs)()}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{view=b.dataset.t;render()});
setInterval(()=>{if(document.hidden)return;flushQ();
 if(S.sum){S.auto--;const a=$("#au");if(a)a.textContent=Math.max(0,S.auto);if(S.auto<=0&&view==="game")go();return}
 if(!run||!S.b)return;D().secs++;S.b.pt++;S.b.qt++;if(view==="game")tUI();if(++tk%5===0)save()},1000);
render();dayInit();
</script></body></html>
